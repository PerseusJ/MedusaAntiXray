# =============================================
#   Medusa-Anti-Xray Configuration
#   Author: PerseusJ | API: 1.20+
#   Version: 1.4.0
# =============================================

detection:
  # Minimum blocks mined before ratio is evaluated (prevents early false flags)
  min-sample-size: 64

  # Ratio of (weighted suspicious ore score / total blocks) to trigger alert
  # 0.08 = ~8% of mined blocks are high-value, well above natural ~1-2%
  alert-threshold: 0.08

  # Sliding window duration in minutes
  window-minutes: 30

  # Global fallback weights (used when no per-ore override is configured below).
  # Weight applied to ores that had NO exposed face (fully hidden = suspicious)
  hidden-ore-weight: 1.0
  # Weight applied to ores that had at least one face exposed to air (cave mining)
  exposed-ore-weight: 0.25

  # ---------------------------------------------------------------------------
  # B1 — Y-level / Depth normalization
  # Multiplies each ore's weight by a factor based on the Y-level it was mined at.
  # Ores found at statistically optimal depths are less suspicious.
  # ---------------------------------------------------------------------------
  depth-normalization:
    enabled: false
    # Multiplier used when no profile range matches (keep at 1.0 to preserve existing behavior)
    default-multiplier: 1.0
    profiles:
      DIAMOND_ORE:
        - y-min: -64   # Optimal diamond layer
          y-max: -54
          multiplier: 0.5   # Low suspicion — expected depth
        - y-min: -53
          y-max: 320
          multiplier: 2.0   # High suspicion — anomalous depth
      DEEPSLATE_DIAMOND_ORE:
        - y-min: -64
          y-max: -54
          multiplier: 0.5
        - y-min: -53
          y-max: 320
          multiplier: 2.0
      ANCIENT_DEBRIS:
        - y-min: 8
          y-max: 22
          multiplier: 0.5   # Optimal ancient debris layer
        - y-min: 23
          y-max: 119
          multiplier: 2.5

  # ---------------------------------------------------------------------------
  # B2 — Vein-awareness grouping
  # Groups contiguous same-ore blocks mined in rapid succession into a single vein
  # to avoid inflating the suspicion score when a player mines a naturally large vein.
  # ---------------------------------------------------------------------------
  vein-grouping:
    enabled: true
    # Max Chebyshev distance between consecutive ore blocks to consider the same vein
    max-distance: 3
    # Max server ticks between adjacent vein-breaks before starting a new vein
    timeout-ticks: 100
    # How to distribute weight across vein blocks:
    #   divide     — each block gets weight / veinSize  (gradual reduction)
    #   first-only — only the first block scores; the rest count as filler
    mode: "divide"

  # ---------------------------------------------------------------------------
  # B4 — Tool & enchantment awareness
  # Adjusts suspicion based on the tool used to mine the ore.
  # Silk Touch and Fortune suggest the player knows what they are looking for
  # (and are working legitimately), while an unenchanted pick is slightly more suspicious.
  # ---------------------------------------------------------------------------
  tool-modifiers:
    enabled: true
    # Multiplier when Silk Touch is active (player sees ore through stone)
    silk-touch-multiplier: 0.5
    # Per-Fortune-level multiplier applied as pow(multiplier, fortuneLevel)
    # Fortune III → 0.8^3 ≈ 0.51 reduction
    fortune-multiplier-per-level: 0.8
    # Multiplier when no relevant enchantments are present (slightly more suspicious)
    no-enchantments-multiplier: 1.2

  # ---------------------------------------------------------------------------
  # B5 — Multi-face exposure scoring
  # Replaces the binary "is this face air?" check with a graduated score that counts
  # how many faces are exposed to air and whether any face has sky light.
  # ---------------------------------------------------------------------------
  exposure-scoring:
    enabled: false
    # Score formula: hiddenWeight + (airFaces / 6) × (exposedWeight − hiddenWeight)
    # If any adjacent face has sky light > 0, the result is multiplied by sky-light-penalty.
    sky-light-penalty: 0.5
    # Ore is treated as fully hidden (max weight) when air-face count <= this value
    hidden-threshold-faces: 1

  # ---------------------------------------------------------------------------
  # C5 — Mine-gap multiplier (vein-first-discovery time metric)
  # Amplifies suspicion when ores are found in rapid succession, as xrayers
  # beeline from vein to vein while honest miners encounter ores more slowly.
  # ---------------------------------------------------------------------------
  mine-gap-multiplier:
    enabled: true
    # Gap <= this many milliseconds gets max-multiplier (rapid sequential finds)
    min-gap-ms: 3000
    # Gap >= this many milliseconds gets 1.0 (no multiplier)
    max-gap-ms: 120000
    # Multiplier applied at min-gap (linear interpolation between min and max)
    max-multiplier: 2.0

  # ---------------------------------------------------------------------------
  # C2 — Mining-style classification
  # Infers the player's mining style (cave, branch, strip) from spatial patterns
  # and adjusts the effective threshold accordingly.
  # ---------------------------------------------------------------------------
  style-multipliers:
    enabled: true
    cave: 0.6       # Cave miners: threshold relaxed (0.08 / 0.6 ≈ 0.133)
    branch: 1.0     # Default
    strip: 1.1      # Strip miners: slightly more suspicious
    unknown: 1.0

worlds:
  overworld:
    enabled: true
    # The exact world name(s) treated as Overworld. Supports multiple entries.
    names:
      - "world"

    # B3: tracked-ores as a map with optional per-ore weight overrides.
    # Each ore can have its own hidden-weight and exposed-weight.
    # Ores without explicit weights use default-hidden-ore-weight / default-exposed-ore-weight.
    # Old string-list format is still supported for backward compatibility.
    tracked-ores:
      DIAMOND_ORE:
        hidden-weight: 1.5
        exposed-weight: 0.4
      DEEPSLATE_DIAMOND_ORE:
        hidden-weight: 1.5
        exposed-weight: 0.4
      GOLD_ORE:
        hidden-weight: 0.6
        exposed-weight: 0.15
      DEEPSLATE_GOLD_ORE:
        hidden-weight: 0.6
        exposed-weight: 0.15
      EMERALD_ORE:
        hidden-weight: 1.2
        exposed-weight: 0.3
      DEEPSLATE_EMERALD_ORE:
        hidden-weight: 1.2
        exposed-weight: 0.3

    # Fallback weights for ores in this world that have no per-ore override.
    # If absent, the global detection.hidden-ore-weight / detection.exposed-ore-weight are used.
    default-hidden-ore-weight: 1.0
    default-exposed-ore-weight: 0.25

    # All stone-family blocks counted as "filler" for ratio denominator
    filler-blocks:
      - STONE
      - DEEPSLATE
      - TUFF
      - COBBLESTONE
      - COBBLED_DEEPSLATE
      - GRAVEL
      - DIRT
      - ANDESITE
      - DIORITE
      - GRANITE

  nether:
    enabled: true
    names:
      - "world_nether"
    tracked-ores:
      ANCIENT_DEBRIS:
        hidden-weight: 2.0
        exposed-weight: 0.5
    default-hidden-ore-weight: 1.0
    default-exposed-ore-weight: 0.25
    filler-blocks:
      - NETHERRACK
      - BASALT
      - BLACKSTONE
      - SOUL_SAND
      - SOUL_SOIL

  # B6 — End world support
  end:
    enabled: false
    names:
      - "world_the_end"
    tracked-ores:
      - OBSIDIAN
      - END_STONE_BRICKS
      - PURPUR_BLOCK
      - CHEST
    default-hidden-ore-weight: 1.0
    default-exposed-ore-weight: 0.25
    filler-blocks:
      - END_STONE

alerts:
  # Seconds between repeated alerts for the same player (prevents chat spam)
  cooldown-seconds: 60

  # Permission required to receive alerts
  staff-permission: "medusa.staff"

  # Message prefix (supports & color codes and hex #RRGGBB)
  prefix: "&8[&4Medusa&8]&r"

  # Legacy alert message (used as default for the 'alert' tier below)
  alert-message: "{prefix} &c⚠ {player} &7may be X-raying! &cRatio: &f{ratio}% &7({score} pts / {total} blocks)"

  # Message sent to /medusa check executor
  check-message: "&7Player &f{player} &7| Score: &c{score} &7| Total: &f{total} &7| Ratio: &c{ratio}% &7| Window: &f{window}m"

  # ---------------------------------------------------------------------------
  # D1 — Alert history persistence
  # ---------------------------------------------------------------------------
  persist-history: true
  # Days to keep alert history (0 = keep forever)
  history-retention-days: 90

  # ---------------------------------------------------------------------------
  # D2 — Escalation tiers
  # Three tiers, evaluated from highest to lowest. The highest matching tier wins.
  # ---------------------------------------------------------------------------
  tiers:
    warning:
      threshold: 0.06
      permission: "medusa.staff"
      message: "{prefix} &e⚠ {player} &7shows unusual mining — Ratio: &e{ratio}% &7({score} pts / {total} blocks)"
      sound: BLOCK_NOTE_BLOCK_BELL
      volume: 0.5
      pitch: 1.0
    alert:
      threshold: 0.08
      permission: "medusa.staff"
      message: "{prefix} &c⚠ {player} &7may be X-raying! &cRatio: &f{ratio}% &7({score} pts / {total} blocks)"
      sound: BLOCK_NOTE_BLOCK_PLING
      volume: 1.0
      pitch: 1.0
    critical:
      threshold: 0.25
      permission: "medusa.staff"
      message: "{prefix} &4&l⚠ CRITICAL: {player} &7has extreme ratio! &4Ratio: &f{ratio}% &7({score} pts / {total} blocks)"
      sound: ENTITY_WITHER_SPAWN
      volume: 1.0
      pitch: 1.0

  # ---------------------------------------------------------------------------
  # D3 — Clickable chat components
  # When enabled, alert messages include a clickable [TP] button (requires Paper).
  # Set enabled: false to fall back to plain text (backward compatible).
  # ---------------------------------------------------------------------------
  clickable-components:
    enabled: true
    tp-command: "/tp {player}"
    tp-hover-text: "&7Click to teleport to &f{player}"
    check-hover-text: "&7Click for detailed stats"

  # ---------------------------------------------------------------------------
  # D4 — Webhook notifications (Discord & Slack)
  # Leave URLs empty to disable individual targets.
  # tiers: only these tier names fire webhooks (lowercase).
  # ---------------------------------------------------------------------------
  webhooks:
    enabled: false
    tiers:
      - alert
      - critical
    discord-url: ""
    slack-url: ""

  # ---------------------------------------------------------------------------
  # D5 — Alert delivery modes
  # Each mode is independently toggleable. Sounds use per-tier config above.
  # ---------------------------------------------------------------------------
  alert-modes:
    chat: true          # Send a chat message
    sound: true         # Play a sound effect
    title: false        # Show a title/subtitle overlay
    title-fade-in-ticks: 10
    title-stay-ticks: 70
    title-fade-out-ticks: 20
    boss-bar: false     # Show a boss bar (auto-removed after boss-bar-seconds)
    boss-bar-color: RED # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
    boss-bar-seconds: 5

  # ---------------------------------------------------------------------------
  # D6 — Periodic digest reports
  # Broadcasts a top-N summary of the most suspicious players at a fixed interval.
  # ---------------------------------------------------------------------------
  digest:
    enabled: false
    interval-minutes: 15
    top-n: 5
    min-ratio: 0.04    # Exclude players below this ratio from the digest
    message: "{prefix} &7Top {n} suspects:\n{entries}"
    entry-format: "  &c{player} &7— Ratio: &c{ratio}% &7({score} pts / {total} blocks)"

false-positive-guards:
  # C1 — Seconds to exempt a player from detection after teleporting
  # (0 = disabled). Prevents false flags when staff /tp to observe or
  # when a player uses /home or /warp.
  teleport-cooldown-seconds: 10

# C4 — Trust tiers & player whitelist
# Allows operators to assign per-player trust multipliers that reduce (or
# increase) detection sensitivity beyond the binary medusa.bypass permission.
# The multiplier is applied to the final suspicion score.
trust:
  # Default multiplier for players not matching any rule
  default: 1.0
  # Permission-based multipliers (checked in order; first match wins)
  perm-multipliers:
    medusa.trust.high: 0.25
    medusa.trust.medium: 0.5
    medusa.trust.low: 0.75
  # Explicit UUID whitelist with custom multipliers (overrides permissions)
  players: {}

# C3 — Learning / baseline calibration mode
# Samples the server's average ore-to-filler ratio over a period and logs
# a recommended alert-threshold. No alerts are dispatched while active.
learning-mode:
  enabled: false
  # How long to collect data before logging the recommended threshold
  duration-minutes: 1440  # 24 hours
  # Log results to console
  log-output: true
  # Also store results in the database
  persist: true
  # Percentile to recommend (e.g. 99 means recommend at the 99th percentile)
  recommend-percentile: 99

messages:
  no-permission: "&cYou don't have permission to use this command."
  reload-success: "&aConfiguration reloaded successfully."
  player-not-found: "&cPlayer &f{player} &cnot found or has no data."
  usage-check: "&cUsage: /medusa check <player>"
  usage: "&cUsage: /medusa <reload|check|trust|top|history|reset|stats|watch|list|gui|help>"

  # E1 — New subcommand message templates
  top-header: "&7=== Top Suspects (Page {page}/{totalPages}) ==="
  top-entry: "&c#{rank} {player} &7| Ratio: &c{ratio}% &7| Score: &f{score} &7| Blocks: &f{total}"
  top-no-results: "&7No flagged players."
  history-header: "&7Alert history for &f{player} &7(page {page}/{totalPages}):"
  history-entry: "&7{timestamp} &c{tier} &7Ratio: &c{ratio}% &7Score: &f{score}"
  history-empty: "&7No alert history for &f{player}."
  reset-success: "&aDetection data for &f{player} &ahas been reset."
  reset-confirm: "&eUse &c/medusa reset {player} confirm &eto proceed."
  reset-no-confirm: "&cWarning &7| &f{player} &7| Ratio: &c{ratio}% &7| Score: &f{score} &7| Blocks: &f{total}"
  stats-message: "&7Tracked: &f{tracked} &7| Flagged: &c{flagged} &7| Alerts today: &c{alertsToday}"
  watch-enabled: "&aNow watching &f{player}&a. Live updates enabled."
  watch-disabled: "&7Stopped watching &f{player}&7."
  help-header: "&7=== Medusa Anti-Xray Help ==="
  list-header: "&7=== Flagged Players (Page {page}/{totalPages}) ==="
  list-entry: "&c{player} &7| Ratio: &c{ratio}% &7| Score: &f{score}"
  list-empty: "&7No flagged players currently online or cached."

# E2 — Command pagination
commands:
  # Number of entries per page for /medusa top, history, and list output.
  page-size: 10

database:
  # Database type: sqlite or mysql
  # If mysql is used, the MySQL JDBC driver must be available on the server classpath.
  type: sqlite

  sqlite:
    file: medusa_antixray.db

  mysql:
    host: localhost
    port: 3306
    database: medusa_antixray
    username: root
    password: ""

  # Auto-save interval in minutes (0 = only save on player quit / server stop)
  save-interval-minutes: 5

  retention:
    # Delete events older than this many days from the database (0 = never purge).
    # The purge runs once every 24 hours asynchronously and does not block saves.
    days: 30

  # Seconds between reconnection attempts when the database is unavailable (0 = never retry).
  # Once reconnected, full persistence resumes automatically.
  retry-interval-seconds: 120

# E3 — Optional inventory-based GUI dashboard
# A chest-inventory menu listing flagged players with skull icons and click actions.
gui:
  enabled: true
  title: "Medusa — Suspects"
  page-size: 45   # 5 rows of 9
  skull-lore:
    - "&7Ratio: &c{ratio}%"
    - "&7Score: &f{score}"
    - "&7Blocks: &f{total}"
    - ""
    - "&eLeft-click &7→ Teleport"
    - "&eRight-click &7→ History"
    - "&eShift-click &7→ Reset"